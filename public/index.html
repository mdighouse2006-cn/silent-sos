<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

  <title>NOTES</title>

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
      padding: 15px;
    }

    h2 { margin-bottom: 15px; }

    .note-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .note-box input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .note-box button {
      background: #4facfe;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 10px;
    }

    .note-card {
      background: rgba(255,255,255,0.08);
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
    }

    .delete-btn {
      background: red;
      border: none;
      color: white;
      border-radius: 6px;
      padding: 5px 8px;
    }

    #contactsPanel {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f0f0f;
      z-index: 999;
      padding: 20px;
      overflow-y: auto;
    }

    .contact-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .contact-box input {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .contact-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.08);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

  </style>
</head>

<body>

<h2>📝 NOTES</h2>

<div class="note-box">
  <input id="noteInput" placeholder="Write something..." />
  <button onclick="addNote()">Add</button>
</div>

<div id="notesList"></div>

<!-- 🔒 CONTACT PANEL -->
<div id="contactsPanel">

  <h2>Contacts</h2>

  <div class="contact-box">
    <input id="contactName" placeholder="Name">
    <input id="contactInfo" placeholder="Email">
    <button onclick="addContact()">Add Contact</button>
  </div>

  <div id="contactsList"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
  emailjs.init("MYw3D4YFCrlRnYPtG");

  var firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "iotlab-c60d7.firebaseapp.com",
    projectId: "iotlab-c60d7"
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();

  function sendEmailToContacts(location) {
    db.collection("contacts").get().then(snapshot => {
      snapshot.forEach(doc => {
        const data = doc.data();

        emailjs.send("service_rhfvcr2", "template_57h0a6s", {
          to_name: data.name,
          to_email: data.info,
          message: location
        });
      });
    });
  }

  function sendAlertToFirestore(lat, lng) {
    db.collection("alerts").add({
      location: lat + "," + lng,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  function addNote() {
    const text = noteInput.value.trim();
    if (!text) return;

    db.collection("notes").add({
      text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(loadNotes);

    noteInput.value = "";
  }

  function loadNotes() {
    notesList.innerHTML = "";

    db.collection("notes").orderBy("createdAt","desc").get()
      .then(snapshot => {
        snapshot.forEach(doc => {
          const div = document.createElement("div");
          div.className = "note-card";

          div.innerHTML = `
            <div>${doc.data().text}</div>
            <button class="delete-btn" onclick="deleteNote('${doc.id}')">✕</button>
          `;

          notesList.appendChild(div);
        });
      });
  }

  function deleteNote(id) {
    db.collection("notes").doc(id).delete().then(loadNotes);
  }

  function addContact() {
    const name = contactName.value.trim();
    const info = contactInfo.value.trim();

    if (!name || !info) return;

    db.collection("contacts").add({
      name, info,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(loadContacts);

    contactName.value = "";
    contactInfo.value = "";
  }

  function loadContacts() {
    contactsList.innerHTML = "";

    db.collection("contacts").orderBy("createdAt","desc").get()
      .then(snapshot => {
        snapshot.forEach(doc => {
          const data = doc.data();

          const div = document.createElement("div");
          div.className = "contact-card";

          div.innerHTML = `
            <div>
              <strong>${data.name}</strong><br>
              <small>${data.info}</small>
            </div>
            <button class="delete-btn" onclick="deleteContact('${doc.id}')">🗑</button>
          `;

          contactsList.appendChild(div);
        });
      });
  }

  function deleteContact(id) {
    db.collection("contacts").doc(id).delete().then(loadContacts);
  }

  let pressTimer;

  document.addEventListener("touchstart", function(e) {
    const t = e.touches[0];
    if (t.clientX < 100 && t.clientY < 100) {
      pressTimer = setTimeout(toggleContacts, 2000);
    }
  });

  document.addEventListener("touchend", () => clearTimeout(pressTimer));

  function toggleContacts() {
    const panel = document.getElementById("contactsPanel");
    panel.style.display = panel.style.display === "block" ? "none" : "block";
    loadContacts();
  }

  window.onload = () => {
    loadNotes();
    loadContacts();
  };
</script>

<script src="gesture.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("SW registered"))
    .catch(err => console.log("SW error", err));
}
</script>

</body>
</html>
